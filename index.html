    <script>
      (function() {
        // 1. Intercept console.error and console.warn to suppress Vite HMR WebSocket connection failure noise
        var origError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(function(a) {
            return (a && (a.message || a.stack || String(a))) || '';
          }).join(' ');
          if (
            msg.indexOf('WebSocket closed without opened') !== -1 ||
            msg.indexOf('failed to connect to websocket') !== -1 ||
            (msg.indexOf('[vite]') !== -1 && (msg.indexOf('websocket') !== -1 || msg.indexOf('WebSocket') !== -1))
          ) {
            return;
          }
          return origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(function(a) {
            return (a && (a.message || a.stack || String(a))) || '';
          }).join(' ');
          if (
            msg.indexOf('WebSocket closed without opened') !== -1 ||
            msg.indexOf('failed to connect to websocket') !== -1
          ) {
            return;
          }
          return origWarn.apply(console, arguments);
        };

        // 2. Intercept unhandled errors and rejections
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = (reason && (reason.message || String(reason))) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || '')) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        // 3. Graceful WebSocket stub for Vite HMR in the preview/iframe environment
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var isViteHmr = false;
            if (typeof url === 'string') {
              if (url.indexOf('vite') !== -1 || url.indexOf('hmr') !== -1) isViteHmr = true;
            }
            if (protocols === 'vite-hmr' || (protocols && String(protocols).indexOf('vite') !== -1)) {
              isViteHmr = true;
            }

            if (isViteHmr) {
              // Benign virtual WebSocket that remains quietly open
              var dummy = {
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                protocol: protocols || 'vite-hmr',
                readyState: 1, // OPEN
                url: url,
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null,
                send: function() {},
                close: function() {},
                addEventListener: function(type, fn) {
                  if (type === 'open') setTimeout(function() { fn({ type: 'open' }); }, 20);
                },
                removeEventListener: function() {},
                dispatchEvent: function() { return true; }
              };
              setTimeout(function() {
                if (typeof dummy.onopen === 'function') {
                  dummy.onopen({ type: 'open' });
                }
              }, 20);
              return dummy;
            }

            return new NativeWebSocket(url, protocols);
          };

          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          window.WebSocket.OPEN = NativeWebSocket.OPEN;
          window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
          window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
        }
      })();
    </script>
